name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify seed integrity
        run: npm run profile

      # No local Supabase/Docker in the gate — see docs/IMPLEMENTATION_PLAN.md §7.1's "Testing
      # strategy — deviation" note. tests/integration/** stays empty (passWithNoTests) until a
      # future phase adds behavioural tests that exercise the deployed app itself; nothing here
      # ever writes to the real cloud project as part of CI.
      - name: Gate
        run: npm run gate
